# nginx перед ЦДС на VDS (вместо профиля caddy из docker-compose).
#   backend слушает 127.0.0.1:8000  (в корневом .env: PRISM_BIND=127.0.0.1, COOKIE_SECURE=1)
#   сертификат: certbot --nginx -d cds.example.ru  (certbot сам допишет пути к сертификату)
# Замените cds.example.ru на свой домен.

upstream cds_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cds.example.ru;

    # certbot проверяет домен по http; остальное — на https
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cds.example.ru;

    ssl_certificate     /etc/letsencrypt/live/cds.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cds.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # шаблоны .pptx до 150 МБ и картинки до 25 МБ — те же лимиты, что в сервисе
    client_max_body_size 160m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # прогресс генерации — SSE: без буферизации и без обрыва долгого соединения (генерация до 5 минут)
    location ~ ^/api/decks/[^/]+/events$ {
        proxy_pass http://cds_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 15m;
        add_header X-Accel-Buffering no;
    }

    # остальное API и фронтенд; смысловой аудит и исправления моделью отвечают до ~1–2 минут
    location / {
        proxy_pass http://cds_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }
}
