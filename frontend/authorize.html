<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ЦДС — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   ЦДС · Авторизация
   Сохраняем визуальный язык основного сайта: тёмный фон,
   живая сетка с оранжевым свечением вокруг курсора,
   стеклянные панели, pill-переключатель, кастомный курсор.
───────────────────────────────────────────────────────────── */
:root{
  --bg: #000;
  --panel: #000911;
  --ink: #fff;
  --orange: #dd5e11;
  --red: #be1212;
  --font: "Unbounded", "Arial Black", sans-serif;
  --font-body: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --lq-glow: rgba(255,255,255,.22);
  --lq-light: rgba(255,255,255,.8);
}
@font-face{
  font-family: "SF Pro Display";
  src: local("SF Pro Display Thin"), local("Helvetica Neue");
  font-weight: 100; font-display: swap;
}
*,*::before,*::after{ box-sizing: border-box; }
html, body{ height:100%; margin:0; overflow:hidden; }
html{ background: var(--bg); }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  cursor: none;
}
@media (hover: none), (pointer: coarse){ body{ cursor: auto; } }

/* ── Сетка-фон ── */
.gridc{
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  background: #000;
  z-index: 0;
}

/* ── Сцена ── */
.stage{
  position: fixed; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  pointer-events: none;
}

/* ── Логотип сверху ── */
.logo{
  position: fixed;
  left: 46px; top: 36px;
  font-size: 42px;
  line-height: 0;
  letter-spacing: -0.3em;
  color: var(--orange);
  z-index: 5;
  pointer-events: none;
  user-select: none;
}

/* ── Стеклянная карточка ── */
.card{
  position: relative;
  width: min(420px, 92vw);
  padding: 34px 32px 28px;
  border-radius: 28px;
  pointer-events: auto;
  background:
    linear-gradient(155deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 48%, rgba(0,0,0,.42) 100%),
    rgba(5,6,9,.62);
  -webkit-backdrop-filter: blur(22px) saturate(140%) brightness(.36);
  backdrop-filter: blur(22px) saturate(140%) brightness(.36);
  border: 0.5px solid rgba(255,255,255,.18);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -0.5px 0 rgba(255,255,255,.12),
    0 30px 80px rgba(0,0,0,.6),
    0 0 0 1px rgba(255,255,255,.04);
  animation: cardIn .9s cubic-bezier(.22, 1.1, .34, 1) both;
}
.card::before{
  content:"";
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    radial-gradient(80% 60% at 12% -10%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%),
    radial-gradient(55% 45% at 92% 8%, rgba(221,94,17,.14), rgba(255,255,255,0) 65%);
}
.card::after{
  content:"";
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  border-bottom: 0.5px solid rgba(255,255,255,.22);
  background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 40%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  padding: 1px;
}
@keyframes cardIn{
  from{ opacity: 0; transform: translateY(24px) scale(.97); filter: blur(8px); }
  to  { opacity: 1; transform: none; filter: blur(0); }
}

/* ── Заголовок ── */
.title{
  margin: 0 0 4px;
  font-size: 28px;
  line-height: 1;
  letter-spacing: -.02em;
  text-transform: uppercase;
}
.title em{ font-style: normal; color: var(--orange); }
.subtitle{
  margin: 8px 0 22px;
  font-family: var(--font-body);
  font-weight: 100;
  font-size: 13px;
  line-height: 1.4;
  color: rgba(255,255,255,.62);
  letter-spacing: .01em;
}

/* ── Pill-переключатель (как линза в шапке) ── */
.pill{
  position: relative;
  display: flex;
  align-items: center;
  gap: 0;
  height: 42px;
  padding: 4px;
  margin-bottom: 22px;
  border-radius: 999px;
  background: rgba(255,255,255,.04);
  border: 0.5px solid rgba(255,255,255,.14);
  overflow: hidden;
}
.pill__lens{
  position: absolute;
  top: 4px; left: 4px;
  height: calc(100% - 8px);
  width: calc(50% - 4px);
  border-radius: 999px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.04) 44%, rgba(255,255,255,.12) 100%);
  -webkit-backdrop-filter: blur(.6px) saturate(150%) brightness(1.3);
  backdrop-filter: blur(.6px) saturate(150%) brightness(1.3);
  border: 0.5px solid rgba(255,255,255,.5);
  box-shadow:
    inset 0 1px 0 var(--lq-light),
    inset 0 -1px 0 rgba(255,255,255,.3),
    inset 0 0 10px var(--lq-glow),
    0 3px 12px rgba(0,0,0,.45);
  transition: transform .52s cubic-bezier(.34, 1.26, .5, 1);
  will-change: transform;
  pointer-events: none;
}
.pill__lens::before{
  content:"";
  position: absolute; inset: 2px 8px;
  border-radius: inherit;
  background:
    linear-gradient(180deg,
      rgba(255,255,255,.46) 0, rgba(255,255,255,0) 2.5px,
      rgba(255,255,255,0) calc(100% - 2.5px), rgba(255,255,255,.26) 100%);
}
.pill.is-signup .pill__lens{ transform: translateX(100%); }
.pill__btn{
  flex: 1;
  height: 100%;
  border: 0;
  background: transparent;
  color: rgba(255,255,255,.62);
  font-family: var(--font);
  font-size: 11px;
  letter-spacing: .02em;
  text-transform: uppercase;
  cursor: none;
  position: relative;
  z-index: 1;
  transition: color .25s;
}
.pill__btn.is-on{ color: var(--ink); }
.pill__btn:focus-visible{ outline: 1.5px solid var(--orange); outline-offset: 2px; border-radius: 999px; }

/* ── Форма ── */
.form{
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.field{
  position: relative;
}
.field__input{
  width: 100%;
  height: 48px;
  padding: 14px 16px 6px;
  background: rgba(255,255,255,.035);
  border: 0.5px solid rgba(255,255,255,.14);
  border-radius: 14px;
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 14px;
  outline: none;
  transition: border-color .2s, background .2s, box-shadow .2s;
}
.field__input::placeholder{ color: transparent; }
.field__input:hover{
  border-color: rgba(255,255,255,.26);
  background: rgba(255,255,255,.05);
}
.field__input:focus{
  border-color: var(--orange);
  background: rgba(255,255,255,.06);
  box-shadow: 0 0 0 3px rgba(221,94,17,.18);
}
.field__label{
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-body);
  font-weight: 200;
  font-size: 13px;
  color: rgba(255,255,255,.5);
  pointer-events: none;
  transition: transform .22s cubic-bezier(.22, 1.1, .34, 1),
              font-size .22s, color .22s, top .22s;
}
.field__input:focus + .field__label,
.field__input:not(:placeholder-shown) + .field__label{
  top: 12px;
  transform: translateY(0);
  font-size: 9px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--orange);
}

/* ── Строка «запомнить / забыли» ── */
.row{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 4px 0 6px;
  font-family: var(--font-body);
  font-weight: 200;
  font-size: 11px;
}
.check{
  display: inline-flex; align-items: center; gap: 8px;
  color: rgba(255,255,255,.7);
  cursor: none;
  user-select: none;
}
.check input{
  appearance: none;
  width: 16px; height: 16px;
  border: 0.5px solid rgba(255,255,255,.3);
  border-radius: 5px;
  background: rgba(255,255,255,.04);
  display: grid; place-items: center;
  cursor: none;
  transition: background .2s, border-color .2s;
}
.check input::after{
  content:"";
  width: 8px; height: 8px;
  border-radius: 2px;
  background: var(--orange);
  transform: scale(0);
  transition: transform .22s cubic-bezier(.34, 1.56, .64, 1);
}
.check input:checked{ border-color: var(--orange); }
.check input:checked::after{ transform: scale(1); }
.forgot{
  color: rgba(255,255,255,.6);
  text-decoration: none;
  border-bottom: 0.5px dashed rgba(255,255,255,.25);
  transition: color .2s, border-color .2s;
}
.forgot:hover{ color: var(--orange); border-color: var(--orange); }

/* ── Кнопка отправки ── */
.submit{
  position: relative;
  height: 52px;
  margin-top: 6px;
  border: 0;
  border-radius: 999px;
  background: var(--orange);
  color: #000;
  font-family: var(--font);
  font-size: 13px;
  letter-spacing: .04em;
  text-transform: uppercase;
  cursor: none;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s, background .2s;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -1px 0 rgba(0,0,0,.25),
    0 10px 30px rgba(221,94,17,.35);
}
.submit:hover{
  background: #f06f1c;
  transform: translateY(-1px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(0,0,0,.3),
    0 14px 38px rgba(221,94,17,.45);
}
.submit:active{ transform: translateY(0); }
.submit::after{
  content:"";
  position: absolute; inset: 0;
  background: linear-gradient(108deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
  transform: translateX(-120%);
  transition: transform .7s;
}
.submit:hover::after{ transform: translateX(120%); }
.submit span{ position: relative; z-index: 1; }

/* ── Подвал карточки ── */
.foot{
  margin-top: 18px;
  text-align: center;
  font-family: var(--font-body);
  font-weight: 200;
  font-size: 11px;
  color: rgba(255,255,255,.55);
}
.foot a{
  color: var(--orange);
  text-decoration: none;
  border-bottom: 0.5px dashed rgba(221,94,17,.4);
  transition: border-color .2s;
}
.foot a:hover{ border-color: var(--orange); }

/* ── Смена форм ── */
.form.is-hidden{ display: none; }
.form.is-enter{ animation: formIn .45s cubic-bezier(.22, 1.1, .34, 1) both; }
@keyframes formIn{
  from{ opacity: 0; transform: translateY(8px); }
  to  { opacity: 1; transform: none; }
}

/* ── Кастомный курсор ── */
.cur, .cur__dot{
  position: fixed; left: 0; top: 0;
  z-index: 90;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s;
  will-change: transform;
}
.cur{
  width: 30px; height: 30px;
  margin: -15px 0 0 -15px;
  border: 1px solid rgba(255,255,255,.5);
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(0,0,0,.45);
}
.cur__dot{
  width: 5px; height: 5px;
  margin: -2.5px 0 0 -2.5px;
  border-radius: 50%;
  background: var(--orange);
}
.cur.is-on{
  border-color: var(--orange);
  background: rgba(221,94,17,.12);
}
.cur.is-vis, .cur__dot.is-vis{ opacity: 1; }
html.has-cur, html.has-cur *{ cursor: none !important; }
@media (hover: none), (pointer: coarse){
  .cur, .cur__dot{ display: none; }
}

/* ── Адаптив ── */
@media (max-width: 480px){
  .logo{ left: 24px; top: 24px; font-size: 32px; }
  .card{ padding: 26px 22px 22px; border-radius: 22px; }
  .title{ font-size: 22px; }
  .subtitle{ font-size: 12px; }
  .pill{ height: 38px; }
  .pill__btn{ font-size: 10px; }
  .field__input{ height: 44px; font-size: 13px; }
}
</style>
</head>
<body>

<!-- Фоновая сетка с живым свечением -->
<canvas class="gridc" id="grid"></canvas>

<!-- Логотип -->
<div class="logo">ЦДС</div>

<!-- Сцена с карточкой -->
<main class="stage">
  <section class="card" id="card" aria-labelledby="title">
    <h1 class="title" id="title">Войти в <em>конфигуратор</em></h1>
    <p class="subtitle" id="subtitle">Сохраняйте колоды, шаблоны и историю генераций</p>

    <!-- Pill-переключатель -->
    <div class="pill" id="pill" role="tablist">
      <span class="pill__lens" aria-hidden="true"></span>
      <button class="pill__btn is-on" data-mode="signin" role="tab" aria-selected="true">Вход</button>
      <button class="pill__btn" data-mode="signup" role="tab" aria-selected="false">Регистрация</button>
    </div>

    <!-- Форма входа -->
    <form class="form is-enter" id="formSignin" autocomplete="on" novalidate>
      <div class="field">
        <input class="field__input" type="email" id="si-email" name="email" placeholder=" " required autocomplete="email">
        <label class="field__label" for="si-email">Email</label>
      </div>
      <div class="field">
        <input class="field__input" type="password" id="si-pass" name="password" placeholder=" " required minlength="6" autocomplete="current-password">
        <label class="field__label" for="si-pass">Пароль</label>
      </div>
      <div class="row">
        <label class="check">
          <input type="checkbox" name="remember" checked>
          Запомнить меня
        </label>
        <a class="forgot" href="#">Забыли пароль?</a>
      </div>
      <button class="submit" type="submit"><span>Войти</span></button>
    </form>

    <!-- Форма регистрации -->
    <form class="form is-hidden" id="formSignup" autocomplete="on" novalidate>
      <div class="field">
        <input class="field__input" type="text" id="su-name" name="name" placeholder=" " required autocomplete="name">
        <label class="field__label" for="su-name">Имя</label>
      </div>
      <div class="field">
        <input class="field__input" type="email" id="su-email" name="email" placeholder=" " required autocomplete="email">
        <label class="field__label" for="su-email">Email</label>
      </div>
      <div class="field">
        <input class="field__input" type="password" id="su-pass" name="password" placeholder=" " required minlength="6" autocomplete="new-password">
        <label class="field__label" for="su-pass">Пароль</label>
      </div>
      <button class="submit" type="submit"><span>Создать аккаунт</span></button>
    </form>

    <p class="foot" id="foot">
      Нет аккаунта? <a href="#" id="flip">Зарегистрироваться</a>
    </p>
  </section>
</main>

<!-- Кастомный курсор -->
<div class="cur" id="cur"></div>
<div class="cur__dot" id="curDot"></div>

<script>
(() => {
'use strict';

/* ── Сетка с оранжевым свечением вокруг курсора ── */
const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d');
const base = document.createElement('canvas');
const bctx = base.getContext('2d');
const glow = document.createElement('canvas');
const glctx = glow.getContext('2d');

const DPR = Math.min(2, devicePixelRatio || 1);
const CELL = 24;
const mouse = { x: -1e4, y: -1e4 };
const spot = { x: 0, y: 0, k: 0 };
let W = innerWidth, H = innerHeight;

function layout(){
  W = innerWidth; H = innerHeight;
  const cw = Math.round(W * DPR), ch = Math.round(H * DPR);
  canvas.width = cw; canvas.height = ch;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  if (base.width !== cw || base.height !== ch){ base.width = cw; base.height = ch; }
  const cell = CELL * (Math.min(W/750, H/422) || 1);
  const path = new Path2D();
  for (let x = (W/2) % cell - cell; x < W + cell; x += cell){ path.moveTo(x, -cell); path.lineTo(x, H + cell); }
  for (let y = (H/2) % cell - cell; y < H + cell; y += cell){ path.moveTo(-cell, y); path.lineTo(W + cell, y); }
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.clearRect(0, 0, W, H);
  bctx.lineWidth = 1.2;
  bctx.strokeStyle = 'rgba(255,255,255,.38)';
  bctx.stroke(path);
  window.__path = path;
}
layout();
addEventListener('resize', layout);

addEventListener('mousemove', (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY;
});
document.addEventListener('mouseleave', () => { mouse.x = -1e4; mouse.y = -1e4; });

function frame(now){
  const t = now / 1000;
  let tx = mouse.x, ty = mouse.y, want = mouse.x > -1e3 ? 1 : 0;
  if (mouse.x < -1e3){
    tx = W/2 + Math.sin(t * 0.5) * W * 0.32;
    ty = H/2 + Math.cos(t * 0.67) * H * 0.28;
    want = 0.7;
  }
  if (spot.x === 0 && spot.y === 0){ spot.x = tx; spot.y = ty; }
  spot.x += (tx - spot.x) * 0.18;
  spot.y += (ty - spot.y) * 0.18;
  spot.k += (want - spot.k) * 0.14;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width, canvas.height);
  ctx.drawImage(base, 0, 0);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  if (spot.k > 0.02){
    const gs = 0.55;
    const gw = Math.round(W * DPR * gs), gh = Math.round(H * DPR * gs);
    if (glow.width !== gw || glow.height !== gh){ glow.width = gw; glow.height = gh; }
    const R = Math.min(W, H) * 0.26;
    const rad = R * 1.15;
    const bl = Math.max(0, spot.x - rad), bt = Math.max(0, spot.y - rad);
    const br = Math.min(W, spot.x + rad), bb = Math.min(H, spot.y + rad);
    const bw = br - bl, bh = bb - bt;
    if (bw > 1 && bh > 1){
      const g = glctx;
      g.setTransform(DPR * gs, 0, 0, DPR * gs, 0, 0);
      g.globalCompositeOperation = 'source-over';
      g.clearRect(bl, bt, bw, bh);
      g.save();
      g.beginPath(); g.rect(bl, bt, bw, bh); g.clip();
      g.lineWidth = 6; g.strokeStyle = 'rgba(190,97,18,.5)';
      g.stroke(window.__path);
      g.lineWidth = 1.8; g.strokeStyle = '#ffa04a';
      g.stroke(window.__path);
      const mask = g.createRadialGradient(spot.x, spot.y, 0, spot.x, spot.y, rad);
      mask.addColorStop(0, `rgba(0,0,0,${spot.k})`);
      mask.addColorStop(0.5, `rgba(0,0,0,${0.62 * spot.k})`);
      mask.addColorStop(1, 'rgba(0,0,0,0)');
      g.globalCompositeOperation = 'destination-in';
      g.fillStyle = mask; g.fillRect(bl, bt, bw, bh);
      g.restore();
      const k = DPR * gs;
      ctx.drawImage(glow, bl*k, bt*k, bw*k, bh*k, bl, bt, bw, bh);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ── Pill-переключатель ── */
const pill = document.getElementById('pill');
const pillBtns = pill.querySelectorAll('.pill__btn');
const formSignin = document.getElementById('formSignin');
const formSignup = document.getElementById('formSignup');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const foot = document.getElementById('foot');
const flip = document.getElementById('flip');

function setMode(mode){
  const isSignup = mode === 'signup';
  pill.classList.toggle('is-signup', isSignup);
  pillBtns.forEach(b => {
    const on = b.dataset.mode === mode;
    b.classList.toggle('is-on', on);
    b.setAttribute('aria-selected', on);
  });
  [formSignin, formSignup].forEach(f => f.classList.add('is-hidden'));
  const target = isSignup ? formSignup : formSignin;
  target.classList.remove('is-hidden');
  target.classList.remove('is-enter');
  void target.offsetWidth;
  target.classList.add('is-enter');

  if (isSignup){
    title.innerHTML = 'Создать <em>аккаунт</em>';
    subtitle.textContent = 'Начните создавать презентации за пару минут';
    foot.innerHTML = 'Уже с нами? <a href="#" id="flip">Войти</a>';
  } else {
    title.innerHTML = 'Войти в <em>конфигуратор</em>';
    subtitle.textContent = 'Сохраняйте колоды, шаблоны и историю генераций';
    foot.innerHTML = 'Нет аккаунта? <a href="#" id="flip">Зарегистрироваться</a>';
  }
  document.getElementById('flip').addEventListener('click', (e) => {
    e.preventDefault();
    setMode(isSignup ? 'signin' : 'signup');
  });
}
pillBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
flip.addEventListener('click', (e) => { e.preventDefault(); setMode('signup'); });

/* ── Отправка формы (демо) ── */
[formSignin, formSignup].forEach(form => {
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const btn = form.querySelector('.submit span');
    const orig = btn.textContent;
    btn.textContent = '…';
    setTimeout(() => {
      btn.textContent = 'Готово ✓';
      setTimeout(() => { btn.textContent = orig; }, 1400);
    }, 700);
  });
});

/* ── Кастомный курсор ── */
const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
const cur = document.getElementById('cur');
const curDot = document.getElementById('curDot');
let curX = 0, curY = 0, curScale = 1, curShown = false;

if (fine){
  document.documentElement.classList.add('has-cur');
  addEventListener('mousemove', (e) => {
    curDot.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
    if (!curShown){
      curShown = true;
      curX = e.clientX; curY = e.clientY;
      cur.classList.add('is-vis');
      curDot.classList.add('is-vis');
    }
  }, { passive: true });
  document.addEventListener('mouseleave', () => {
    curShown = false;
    cur.classList.remove('is-vis');
    curDot.classList.remove('is-vis');
  });
  document.addEventListener('mouseover', (e) => {
    const hot = !!e.target.closest('a, button, input, label, .pill__btn, .check, .forgot, [data-hot]');
    cur.classList.toggle('is-on', hot);
  }, { passive: true });

  function cursorFrame(){
    if (curShown){
      curX += (mouse.x - curX) * 0.2;
      curY += (mouse.y - curY) * 0.2;
      const want = cur.classList.contains('is-on') ? 1.5 : 1;
      curScale += (want - curScale) * 0.15;
      cur.style.transform = `translate3d(${curX}px, ${curY}px, 0) scale(${curScale})`;
    }
    requestAnimationFrame(cursorFrame);
  }
  requestAnimationFrame(cursorFrame);
}

})();
</script>
