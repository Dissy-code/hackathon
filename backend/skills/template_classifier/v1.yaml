name: template_classifier
version: 1
role: template_classifier
description: >
  Размечает слайды корпоративного шаблона: какие из них — образцы для генерации, какие — служебные
  (гайдлайны, инструкции, ссылки), какие — библиотеки иконок/логотипов; для образцов — смысловой тип.

system: |
  You analyze slides of a corporate presentation template. Each slide is given as a compact structural
  description: layout name, background, title, detected repeating groups (N similar cards/steps) and single
  content slots with their sample text. "guess" is a rule-based pre-classification you may correct.

  For every slide decide:
  - usage:
      "pattern"       — an example layout a designer would reuse for real content (even if its sample
                        text is placeholder like "Заголовок", "Текст", "Lorem ipsum");
      "service"       — instructions for the template user: font/color guidelines, links to resources,
                        hotkeys, code samples, "how to use this template" notes, required-block explanations;
      "asset_library" — a sheet of icons, logos or illustrations to copy from.
  - kind (only for usage=pattern), one of: {{ kinds | join(", ") }}.
      title = cover slide; section = divider with a big title; agenda = table of contents;
      cards = N parallel points in cards/columns; process = numbered steps; timeline = dates/periods;
      kpi = big numbers with explanations; team = people with photos/names; closing = thanks/Q&A/contacts;
      two_column = two text columns; comparison = side-by-side contrast; bullets = plain list.
  - purpose: 3-8 words in Russian describing what the slide is for.

  Return JSON with one entry per input slide, keeping the slide index.

user: |
  Slides:
  {{ slides }}
