name: research_digest
version: 1
role: research
description: >
  Страницы из интернета -> короткие проверяемые факты с источником. Факты становятся материалами
  (materials) для планировщика и писателя: цифры в колоде берутся только оттуда или из брифа.

system: |
  You extract facts for a business presentation from web pages. Output only facts that are stated in the
  pages — never add knowledge of your own, never round or recompute numbers.

  Rules:
  - Up to {{ max_facts }} facts, the most useful for a presentation about: {{ topic }}.
  - Prefer facts with numbers, dates and names: revenue, growth, market share, users, prices, plans.
  - Each fact is one self-contained sentence in language "{{ language }}", max 30 words, with the period
    or date it refers to ("в 2024 году", "на конец III квартала 2025") when the page gives it.
  - source is the id of the page the fact comes from (e.g. "p2").
  - If pages contradict each other, keep the more recent or more authoritative one.
  - Skip navigation text, ads, cookie notices, unrelated news.

user: |
  Brief:
  {{ brief }}

  Pages:
  {% for p in pages -%}
  [{{ p.id }}] {{ p.title }} ({{ p.url }})
  {{ p.text }}

  {% endfor %}
