# Основной конфиг сервиса. Значения ${VAR} / ${VAR:-default} берутся из окружения (backend/.env).

# Провайдер модели всегда один — любой OpenAI-совместимый API (Open WebUI, vLLM, llama.cpp, облако).
# Сменить модель или провайдера = поменять переменные в .env, конфиг и код не трогаются.
llm:
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  # Как говорить с провайдером о нестандартных параметрах:
  #   vllm       — vLLM / llama.cpp / SGLang / Open WebUI: chat_template_kwargs.enable_thinking, top_k
  #   openrouter — OpenRouter и совместимые (alltokens.ru): reasoning.enabled, без top_k
  #   plain      — только стандартные параметры OpenAI
  api_style: ${LLM_API_STYLE:-vllm}
  timeout_s: 90            # на один запрос; общий лимит — 5 минут на все колоды
  max_retries: 4           # в т.ч. на 429 «перегружено» — у бесплатных моделей это обычное дело
  models:
    text: ${LLM_MODEL}
    vision: ${LLM_VISION_MODEL:-}        # пусто — та же модель, что text (если она мультимодальная)

# Параметры по умолчанию — рекомендации из карточки Ornith-1.5 для general tasks.
role_defaults:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  think: false
  max_tokens: 4096

# Узлы графа ссылаются только на роли; какая модель за ролью — решает профиль.
roles:
  # без размышлений: с ними план шёл >60 с и упирался в таймаут шлюза, а лимит — 5 минут на колоду
  outline_planner: { model: text,   think: false, temperature: 0.4, max_tokens: 4000 }
  # пачке из 4 слайдов хватает ~1500 токенов; лимит с запасом, но обрывает зацикливание быстро
  slide_writer:    { model: text,   temperature: 0.5, max_tokens: 3500 }
  shorten:         { model: text,   temperature: 0.3, max_tokens: 1500 }
  fix_agent:       { model: text,   temperature: 0.3, max_tokens: 2500 }
  research:        { model: text,   temperature: 0.3, max_tokens: 3000 }
  template_classifier: { model: text, temperature: 0.2, max_tokens: 8192 }
  layout_classify: { model: vision, temperature: 0.2 }
  audit_vlm:       { model: vision, temperature: 0.2, max_tokens: 1200 }

# MCP-серверы — инструменты агентов графа (streamable HTTP). Пустой адрес — сервер не используется.
#   web  — поиск через self-hosted SearXNG и чтение страниц (prism/mcp/web_server.py)
#   pptx — разбор шаблонов, осмотр, правка и рендер слайдов (prism/mcp/pptx_server.py)
mcp:
  web: ${MCP_WEB_URL:-}
  pptx: ${MCP_PPTX_URL:-}

# Короткий бриф — модель сама ищет материалы в интернете через MCP web.
research:
  min_brief_words: 60
  max_queries: 3
  max_pages: 4
  page_chars: 6000
  budget_s: 60

# Закреплённые версии скиллов (skills/<name>/v<N>.yaml). Не указан — берётся последняя.
skills: {}
