[project]
name = "prism-backend"
version = "0.1.0"
description = "Цифровой дизайнер презентаций: парсинг шаблонов, генерация, вёрстка, аудит, экспорт"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "python-pptx>=1.0",
    "lxml>=5.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: обращается к реальному LLM-провайдеру (запуск: pytest -m live)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"
